# Example steptrace configuration file (TOML)
# Copy to your project root or specify with --config

# Directory for trace output files
log_dir = ".tracer"

# Filter to only trace workspace files (recommended)
filter_workspace = true

# Optional: List of function names to trace (omit to trace all)
# traceable_functions = ["main", "my_function"]

# Type-specific property and method tracking
# Map class names to properties/methods to record in the structured trace.
# Use "module.ClassName" to disambiguate when multiple classes share a name.
# Callable attributes (methods) are invoked with no arguments automatically.
[type_config]
"ndarray" = ["shape", "dtype", "sum"]
"simple_script.Vector2D" = ["x", "y", "magnitude"]
# "myapp.models.User" = ["full_name", "is_active"]
